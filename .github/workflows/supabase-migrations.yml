name: Supabase migration validation

on:
  push:
    branches:
      - fix/initial-supabase-migrations
  pull_request:
    branches:
      - main

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novagrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d novagrid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: novagrid_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase auth test surface
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Apply all migrations in order
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run schema and tenant-isolation smoke tests
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/migration-smoke.sql
          visible="$(psql -Atc "select count(*) from public.contacts")"
          test "$visible" = "1"
          echo "Tenant A sees exactly one contact; cross-tenant rows are hidden."
