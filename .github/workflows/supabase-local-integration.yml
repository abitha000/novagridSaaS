name: Supabase local integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Apply NOVAGRID migrations to disposable local Supabase
        run: supabase db reset --local
      - name: Export local Supabase credentials
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"
      - name: Verify Auth, PostgREST tenant isolation and Storage API
        run: node scripts/supabase-local-integration.mjs
      - name: Capture local Storage diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Running containers ==="
          docker ps -a --format 'table {{.Names}}\\t{{.Status}}'
          echo "=== Storage service logs ==="
          for id in $(docker ps -aq --filter "name=storage"); do
            docker logs --tail 250 "$id" 2>&1 || true
          done
          echo "=== Database logs ==="
          for id in $(docker ps -aq --filter "name=db"); do
            docker logs --tail 250 "$id" 2>&1 || true
          done
      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
